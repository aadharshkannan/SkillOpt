# Dataverse SkillOpt env — shared base for all per-skill configs.
_base_: ../_base_/default.yaml

model:
  target_backend: copilot_cli_exec
  optimizer_backend: openai_chat
  judge_backend: openai_chat

train:
  batch_size: 8
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 8

optimizer:
  learning_rate: 3
  lr_scheduler: cosine
  skill_update_mode: patch
  use_slow_update: true
  use_meta_skill: true

evaluation:
  use_gate: true
  eval_test: true

env:
  name: dataverse
  workers: 24
  live_workers: 4
  exec_timeout: 240
  max_turns: 1
  max_completion_tokens: 16384
  live_enabled: true
  live_solution: SkillOptEvals
  live_prefix: sko
  record_bodies: false
